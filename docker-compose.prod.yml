services:
  ollama:
    image: ollama/ollama
    container_name: survey_ollama_prod
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: survey_backend_prod
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      - ollama
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: survey_frontend_prod
    ports:
      - "4545:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  ollama_data:
